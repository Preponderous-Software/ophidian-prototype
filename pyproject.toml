# Tool configuration only - Ophidian is run from source (run.sh) rather than
# installed, so there is no [project]/[build-system] table here.

[tool.black]
# src/lib holds vendored copies of graphik, py_env_lib and trace_client, and
# tests/lib holds trace_client's own test. Reformatting them makes re-vendoring
# an upstream copy a merge conflict for no benefit, so they are excluded here
# rather than in format.sh's arguments - that way an editor integration or a
# bare `black src` picks the exclusion up too (see issue #120).
extend-exclude = '''
/src/lib/
|/tests/lib/
'''
